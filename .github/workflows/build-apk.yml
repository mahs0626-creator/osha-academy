name: Build OSHA Academy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Flutter project
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Searching for pubspec.yaml:"
          find . -name pubspec.yaml -print

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Get dependencies
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Flutter project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -print -quit)")
          echo "Flutter project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osha-academy-debug-apk
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
          if-no-files-found: error
          retention-days: 7
